<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Learning Use Cases</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #0f172a;
            --grad-1: #0f2027;
            --grad-2: #203a43;
            --grad-3: #2c5364;
            --surface: #16233bcc;
            --surface-solid: #16233b;
            --accent-cyan: #22d3ee;
            --accent-violet: #a78bfa;
            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            margin: 0;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-body);
        }

        h1, h2, h3, h4, h5 {
            font-family: var(--font-display);
        }

        .ml-hero {
            background: linear-gradient(135deg, var(--grad-1), var(--grad-2), var(--grad-3));
            padding: 100px 20px 90px;
            text-align: center;
        }

        .ml-eyebrow {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .ml-hero__title {
            font-weight: 700;
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin: 12px 0 16px;
        }

        .ml-hero__subtitle {
            color: var(--text-muted);
            max-width: 640px;
            margin: 0 auto;
            font-size: 1.15rem;
        }

        .ml-feature {
            background: var(--surface);
            border: 1px solid #ffffff14;
            border-radius: 16px;
            height: 100%;
            padding: 28px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .ml-feature:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
        }

        .ml-feature i {
            font-size: 2rem;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: block;
        }

        .ml-feature h4 {
            margin-bottom: 15px;
        }

        .btn-outline-info {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-outline-info:hover {
            background: var(--accent-cyan);
            color: var(--bg-deep);
        }
    </style>
</head>

<body>

    <div class="container">

        </a>

                        Machine Learning

                    <ul class="dropdown-menu">

                        <li><a class="dropdown-item" href="/types">Types</a></li>
                        <li><a class="dropdown-item" href="/use-cases">Use Cases</a></li>
                    </ul>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"

                    <ul class="dropdown-menu">

                                Linear Regression
                            </a>
                        </li>
                    </ul>
                </li>

            </ul>

        </div>
    </div>
</nav>

<header class="ml-hero">

        <h1 class="ml-hero__title">Use Cases</h1>
        <p class="ml-hero__subtitle">

    </div>
</header>

<div class="container py-5">

    <div class="row g-4">

<footer class="bg-dark text-white text-center py-3">

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
